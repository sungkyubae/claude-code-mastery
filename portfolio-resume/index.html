<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>홍길동 | Frontend Developer 이력서</title>
  <meta name="description" content="Frontend Developer 홍길동의 온라인 이력서 및 포트폴리오입니다. 경력, 프로젝트, 기술 스택을 확인하세요." />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="홍길동 | Frontend Developer 이력서" />
  <meta property="og:description" content="Frontend Developer 홍길동의 온라인 이력서 및 포트폴리오입니다." />
  <meta property="og:image" content="assets/images/profile-placeholder.svg" />

  <!-- 파비콘 (인라인 SVG data URI) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%234f46e5'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='white' font-family='Arial'%3EH%3C/text%3E%3C/svg%3E" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="dist/output.css" />
</head>
<body class="bg-white text-secondary-800 dark:bg-secondary-900 dark:text-secondary-100 font-sans">
  <noscript>
    <p style="padding:1rem;text-align:center;">이 페이지는 자바스크립트가 필요합니다. 브라우저에서 자바스크립트를 활성화해주세요.</p>
  </noscript>

  <!-- 헤더 / 내비게이션 -->
  <header class="sticky top-0 z-50 border-b border-secondary-200 bg-white/90 backdrop-blur dark:border-secondary-800 dark:bg-secondary-900/90 print-hidden">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3 sm:px-6">
      <a href="#top" class="text-lg font-bold text-primary-600 dark:text-primary-400" id="header-name">이력서</a>

      <nav aria-label="주요 내비게이션" class="hidden md:block">
        <ul class="flex gap-6 text-sm font-medium" id="nav-list">
          <li><a href="#about" class="nav-link" data-nav="about">About</a></li>
          <li><a href="#skills" class="nav-link" data-nav="skills">Skills</a></li>
          <li><a href="#experience" class="nav-link" data-nav="experience">Experience</a></li>
          <li><a href="#projects" class="nav-link" data-nav="projects">Projects</a></li>
          <li><a href="#education" class="nav-link" data-nav="education">Education</a></li>
          <li><a href="#contact" class="nav-link" data-nav="contact">Contact</a></li>
        </ul>
      </nav>

      <div class="flex items-center gap-2">
        <button
          id="dark-mode-toggle"
          type="button"
          aria-label="다크모드 전환"
          class="rounded-md p-2 text-secondary-600 hover:bg-secondary-100 dark:text-secondary-300 dark:hover:bg-secondary-800"
        >🌙</button>

        <button
          id="mobile-menu-btn"
          type="button"
          aria-label="메뉴 열기"
          aria-expanded="false"
          aria-controls="mobile-menu"
          class="rounded-md p-2 text-secondary-600 hover:bg-secondary-100 dark:text-secondary-300 dark:hover:bg-secondary-800 md:hidden"
        >☰</button>
      </div>
    </div>

    <!-- 모바일 메뉴 -->
    <nav id="mobile-menu" aria-label="모바일 내비게이션" hidden class="border-t border-secondary-200 md:hidden dark:border-secondary-800">
      <ul class="flex flex-col gap-1 px-4 py-3 text-sm font-medium">
        <li><a href="#about" class="mobile-nav-link block py-2" data-nav="about">About</a></li>
        <li><a href="#skills" class="mobile-nav-link block py-2" data-nav="skills">Skills</a></li>
        <li><a href="#experience" class="mobile-nav-link block py-2" data-nav="experience">Experience</a></li>
        <li><a href="#projects" class="mobile-nav-link block py-2" data-nav="projects">Projects</a></li>
        <li><a href="#education" class="mobile-nav-link block py-2" data-nav="education">Education</a></li>
        <li><a href="#contact" class="mobile-nav-link block py-2" data-nav="contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="top">
    <!-- 히어로 / 프로필 -->
    <section class="reveal mx-auto flex max-w-5xl flex-col items-center gap-6 px-4 py-16 text-center sm:px-6">
      <img id="profile-photo" src="" alt="프로필 사진" class="h-32 w-32 rounded-full border-4 border-primary-100 object-cover dark:border-primary-900" />
      <h1 id="profile-name" class="text-3xl font-bold sm:text-4xl"></h1>
      <p id="profile-job-title" class="text-lg font-medium text-primary-600 dark:text-primary-400"></p>
      <p id="profile-tagline" class="max-w-xl text-secondary-600 dark:text-secondary-300"></p>
    </section>

    <!-- About -->
    <section id="about" class="reveal mx-auto max-w-5xl px-4 py-12 sm:px-6">
      <h2 class="mb-6 text-2xl font-bold">About</h2>
      <div id="about-content" class="space-y-3 text-secondary-700 dark:text-secondary-200"></div>
    </section>

    <!-- Skills -->
    <section id="skills" class="reveal mx-auto max-w-5xl px-4 py-12 sm:px-6">
      <h2 class="mb-6 text-2xl font-bold">Skills</h2>
      <div id="skills-content" class="space-y-6"></div>
    </section>

    <!-- Experience -->
    <section id="experience" class="reveal mx-auto max-w-5xl px-4 py-12 sm:px-6">
      <h2 class="mb-6 text-2xl font-bold">Experience</h2>
      <div id="experience-content"></div>
    </section>

    <!-- Projects -->
    <section id="projects" class="reveal mx-auto max-w-5xl px-4 py-12 sm:px-6">
      <h2 class="mb-6 text-2xl font-bold">Projects</h2>
      <div class="relative">
        <button id="projects-prev" type="button" aria-label="이전 프로젝트" class="carousel-arrow left-0">‹</button>
        <div id="projects-track" class="projects-track"></div>
        <button id="projects-next" type="button" aria-label="다음 프로젝트" class="carousel-arrow right-0">›</button>
      </div>
      <div id="projects-dots" class="mt-4 flex justify-center gap-2"></div>
    </section>

    <!-- Education -->
    <section id="education" class="reveal mx-auto max-w-5xl px-4 py-12 sm:px-6">
      <h2 class="mb-6 text-2xl font-bold">Education</h2>
      <div id="education-content" class="mb-8"></div>

      <h3 class="mb-4 text-lg font-semibold">자격증 및 수상</h3>
      <div id="certificates-content"></div>
    </section>

    <!-- Contact -->
    <section id="contact" class="reveal mx-auto max-w-5xl px-4 py-12 sm:px-6">
      <h2 class="mb-6 text-2xl font-bold">Contact</h2>
      <div id="contact-content" class="mb-8 space-y-2 text-secondary-700 dark:text-secondary-200"></div>

      <h3 class="mb-4 text-lg font-semibold">SNS</h3>
      <div id="social-links" class="flex flex-wrap gap-3"></div>
    </section>
  </main>

  <!-- 푸터 -->
  <footer class="border-t border-secondary-200 py-10 dark:border-secondary-800 print-hidden">
    <div class="mx-auto flex max-w-5xl flex-col items-center gap-4 px-4 text-center sm:px-6">
      <div id="footer-social-icons" class="flex gap-3"></div>

      <a
        id="resume-download"
        href="assets/resume.pdf"
        download
        class="rounded-md bg-primary-600 px-5 py-2 text-sm font-semibold text-white hover:bg-primary-700"
      >이력서 PDF 다운로드</a>

      <p id="footer-copyright" class="text-sm text-secondary-500 dark:text-secondary-400"></p>
    </div>
  </footer>

  <script src="src/content.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
